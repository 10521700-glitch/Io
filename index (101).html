<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELITE 1.8.9 // RANKING OFICIAL</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;700;900&family=Geist+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
:root{--paper:#FFFCF5;--paper-2:#FFF6E9;--ink:#121212;--ink-2:#6B6560;--line:#EDE6DA;--line-2:#F2EDE3;--yellow:#FFD600}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:'Geist',sans-serif;overflow-x:hidden}
body::before{content:'';position:fixed;inset:-50%;z-index:-1;background:radial-gradient(600px circle at 20% 10%, #FFE9C6 0%, transparent 60%),radial-gradient(500px circle at 80% 20%, #FFDAB8 0%, transparent 50%)}
.nav{position:sticky;top:0;z-index:50;background:rgba(255,252,245,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-weight:900}
.logo-mark{width:28px;height:28px;background:var(--ink);color:var(--paper);display:grid;place-items:center;border-radius:8px;font-size:12px}
.nav-pills{display:flex;gap:6px;background:var(--paper-2);border:1px solid var(--line);padding:4px;border-radius:100px}
.nav-pills a{padding:7px 14px;border-radius:100px;font-size:12px;font-weight:600;color:var(--ink-2);text-decoration:none}
.nav-pills a.active{background:var(--ink);color:var(--paper)}
.hero{max-width:1280px;margin:0 auto;padding:72px 24px 32px}
.hero-title{font-family:'Instrument Serif',serif;font-size:clamp(64px,10vw,132px);line-height:.85;letter-spacing:-4px}
.hero-title div{overflow:hidden}.hero-title div span{display:block}
.hero-sub{margin-top:20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.bento{max-width:1280px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.bento{grid-template-columns:1fr}}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:28px;padding:22px;overflow:hidden;cursor:pointer}
.card.king{background:linear-gradient(180deg, #FFFEFB 0%, #FFF8E8 100%);border-color:#F1D98C}
.card::before{content:'';position:absolute;inset:0;background:radial-gradient(400px circle at var(--mx,50%) var(--my,50%), rgba(255,214,0,.18), transparent 40%);opacity:0;transition:.4s}
.card:hover::before{opacity:1}
.mono{font-family:'Geist Mono';font-size:11px;letter-spacing:1px;color:var(--ink-2)}
.card-skin{width:100%;height:140px;display:grid;place-items:center;margin:8px 0;filter:drop-shadow(0 12px 24px rgba(0,0,0,.12))}
.card-name{font-size:24px;font-weight:800;letter-spacing:-1px}
.main{max-width:1280px;margin:24px auto;padding:0 24px 60px}
.shell{background:#fff;border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(180,160,140,.12)}
.shell-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line-2);gap:12px;flex-wrap:wrap}
.search{position:relative;flex:1;max-width:340px}
.search input{width:100%;background:var(--paper-2);border:1px solid var(--line);border-radius:100px;padding:11px 16px 11px 40px;font-size:13px;outline:none;transition:.3s}
.search input:focus{border-color:var(--ink);box-shadow:0 0 0 4px rgba(18,18,18,.06)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-2)}
table{width:100%;border-collapse:collapse;min-width:740px}
th{padding:14px 20px;text-align:left;font-size:10px;letter-spacing:1.5px;color:var(--ink-2);text-transform:uppercase;background:#FFFCF5}
td{padding:14px 20px;border-top:1px solid var(--line-2);font-size:13px}
tr:hover{background:var(--paper-2)}
tr.king-row{background:linear-gradient(90deg, #FFF9DC 0%, #fff 100%)}
.player{display:flex;align-items:center;gap:12px}
.tag{padding:4px 9px;border-radius:100px;font-size:10px;font-weight:800}
.k{background:var(--yellow);color:#000}.live{background:var(--ink);color:#fff}
.skin{display:inline-block;filter:drop-shadow(0 10px 20px rgba(0,0,0,.15))}
.skin.sm{width:52px;height:52px}.skin.md{width:100px;height:100px}.skin.big{width:140px;height:140px}
.skin img{width:100%;height:100%;object-fit:contain;display:block}
.pages{display:flex;justify-content:center;gap:6px;padding:18px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.pages button{min-width:36px;height:36px;border-radius:100px;border:1px solid var(--line);background:#fff;color:var(--ink-2);font-family:'Geist Mono';font-size:12px;font-weight:700;cursor:pointer;transition:.3s}
.pages button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(255,252,245,.6);backdrop-filter:blur(18px);display:none;place-items:center;padding:20px;z-index:100}
.modal.active{display:grid}
.modal-box{width:100%;max-width:500px;background:#fff;border:1px solid var(--line);border-radius:32px;padding:28px;box-shadow:0 40px 100px rgba(120,100,80,.25)}
.close{float:right;width:32px;height:32px;border-radius:50%;background:var(--paper-2);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;transition:.2s}
.close:hover{transform:rotate(90deg);background:var(--ink);color:#fff}
</style>
</head>
<body>
<div class="nav"><div class="logo"><div class="logo-mark">E</div> ELITE 1.8.9</div><div class="nav-pills"><a href="#">Home</a><a class="active">Ranking</a><a href="#">Hall</a></div></div>
<div class="hero">
  <div class="hero-title" id="heroTitle"><div><span>RANKING</span></div><div><span style="color:#B8A99A"><i>OFICIAL</i> 1.8.9</span></div></div>
  <div class="hero-sub"><div class="mono">TOP 5 BarneyTheGod • TOP 7 FrenchToast • TOP 8 23fps • #12 xjeff • #35 chinno063090 • #53 ema900</div><div style="padding:6px 12px;background:var(--ink);color:#fff;border-radius:100px;font-size:11px;font-weight:700">LIVE</div></div>
</div>
<div class="bento" id="top3"></div>
<div class="main">
  <div class="shell" id="shell">
    <div class="shell-head"><div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="search" placeholder="Buscar jugador..."></div><div class="mono">101 JUGADORES • FIJOS</div></div>
    <div style="overflow-x:auto"><table><thead><tr><th>POS</th><th>JUGADOR</th><th>KDR</th><th>ELO</th><th>ESTADO</th></tr></thead><tbody id="tbody"></tbody></table></div>
    <div class="pages" id="pagination"></div>
  </div>
</div>
<div class="modal" id="profile"><div class="modal-box" id="profileC"></div></div>
<script>
const REAL_SKINS = ["Technoblade","Dream","Notch","Grian","MumboJumbo","GeorgeNotFound","Sapnap","BadBoyHalo","Skeppy","Quackity","WilburSoot","TommyInnit","Tubbo","Ranboo","CaptainSparklez","DanTDM","Ph1LzA","Purpled","ClownPierce","Huahwi","Stimpy","TapL","Cayden","Wisp","Vitalasy","xNestorio","LegoMaestro","Kocmoc","SweatyPvP","Minemanner","Toum","Pigical","BarneyTheGod","FrenchToast","23fps"];
const NAME_POOL = ["Vortex","Nixtro","Zer0","Aether","Phantom","Oblivion","Nova","Titan","Frost","Shadow","Crimson","Iron","Blaze","Night","Storm","Quantum","Omega","Solar","Steel","Echo","Rift","Thunder","Magma","Sky","Void","Pixel","Turbo","Delta","Alpha","Beta","Gamma","Sigma","Theta","Lambda","Aero","Blitz","Cyber","Neon","FrostWolf","IronClad","ShadowBlade","StormBreaker","Venom","Wraith","Apex","Blazing","DarkMatter","EchoFang","GhostRider","HyperNova","Inferno","Kronos","Lunar","Meteor","Obsidian","Quasar","Raptor","SolarFlare","Specter","Reaper","Havoc","Valkyr","Zephyr","Orion","Draco","Kairo","Jett","Riven","Axel","Zane","Knox","Rogue","Maverick","Fable","Onyx","Reign","Vandal","Warden","Cipher","Omen","Brim","Yoru","Sova","Viper","Sage","Reyna","Raze","Chamber","Fade","Astra","Harbor","Gekko","Deadlock","Iso","Clove"];
const FIXED_POS = {5:"BarneyTheGod", 7:"FrenchToast", 8:"23fps", 12:"xjeff", 35:"chinno063090", 53:"ema900"};
const STORAGE_KEY = "elite_final_v8_23fps";
function generateFixed(){
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved){ try{ return JSON.parse(saved); }catch(e){} }
  let players=[]; let used=new Set();
  Object.values(FIXED_POS).forEach(n=>used.add(n.toLowerCase()));
  let pool=[...NAME_POOL].sort(()=>0.5-Math.random()); let idx=0;
  for(let i=1;i<=101;i++){
    let name;
    if(FIXED_POS[i]) name=FIXED_POS[i];
    else {
      do{
        if(idx>=pool.length){ pool=[...NAME_POOL].sort(()=>0.5-Math.random()); idx=0; }
        let base=pool[idx++];
        let suffix=Math.random()<0.35? String(Math.floor(Math.random()*900+10)) : "";
        name=base+suffix;
      }while(used.has(name.toLowerCase()) || name.length<3);
    }
    used.add(name.toLowerCase());
    let elo=Math.floor(9800 - i*28 + Math.random()*50);
    let kdr=(5.8 - Math.random()*1.8).toFixed(2);
    players.push({rank:i,name:name,kdr:kdr,elo:elo,wins:Math.floor(1200 - i*6 + Math.random()*40)});
  }
  players[0].name="Vortex"; players[0].elo=9842; players[0].kdr="6.12"; players[0].wins=1847;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(players));
  return players;
}
const PLAYERS=generateFixed();
let skinMap={}, usedSkins=new Set();
function getSkin(n){
  if(skinMap[n]) return skinMap[n];
  if(n==="xjeff"){ skinMap[n]="Dream"; return "Dream"; }
  if(n==="chinno063090"){ skinMap[n]="Technoblade"; return "Technoblade"; }
  if(n==="ema900"){ skinMap[n]="Grian"; return "Grian"; }
  if(n==="BarneyTheGod"){ skinMap[n]="MumboJumbo"; return "MumboJumbo"; }
  if(n==="FrenchToast"){ skinMap[n]="Quackity"; return "Quackity"; }
  if(n==="23fps"){ skinMap[n]="Notch"; return "Notch"; }
  if(n==="Vortex"){ skinMap[n]="Purpled"; return "Purpled"; }
  let real, tries=0;
  do{ real=REAL_SKINS[Math.floor(Math.random()*REAL_SKINS.length)]; tries++; if(tries>100) break; }while(usedSkins.has(real) && usedSkins.size<REAL_SKINS.length);
  usedSkins.add(real); skinMap[n]=real; return real;
}
function skinEl(name,size){
  const n=encodeURIComponent(getSkin(name));
  return `<div class="skin ${size}"><img src="https://visage.surge.sh/full/512/${n}" onerror="this.onerror=null; this.src='https://mc-heads.net/player/${n}/128'" alt="${name}" loading="lazy"></div>`;
}
function openProfile(idx){
  const p=PLAYERS[idx];
  document.getElementById('profileC').innerHTML=`
    <span class="close" id="closeBtn">✕</span>
    <div style="display:flex;gap:20px;align-items:center">${skinEl(p.name,'big')}
      <div><h2 style="font-size:28px;font-weight:900;letter-spacing:-1px">${p.name}</h2>
      <div class="mono" style="margin-top:6px">RANK #${p.rank} • ${p.wins} WINS</div>
      <div style="margin-top:10px"><span class="tag live">● ACTIVO</span> ${p.rank<=8?'<span class="tag k">TOP 8</span>':''}</div></div>
    </div>
    <div style="margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div style="background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:14px"><div class="mono">KDR</div><div style="font-weight:800;font-size:22px;margin-top:4px">${p.kdr}</div></div>
      <div style="background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:14px"><div class="mono">ELO</div><div style="font-weight:800;font-size:22px;margin-top:4px">${p.elo.toLocaleString()}</div></div>
    </div>`;
  const modal=document.getElementById('profile');
  modal.classList.add('active');
  gsap.set("#profileC", {scale:0.85, y:40, opacity:0, rotationX:-10});
  gsap.to("#profileC", {scale:1, y:0, opacity:1, rotationX:0, duration:0.7, ease:"power4.out"});
  gsap.fromTo("#profile", {backdropFilter:"blur(0px)"}, {backdropFilter:"blur(18px)", duration:0.5});
  document.getElementById('closeBtn').onclick=()=>closeProfile();
  modal.onclick=(e)=>{ if(e.target===modal) closeProfile(); };
}
function closeProfile(){
  const modal=document.getElementById('profile');
  const box=document.getElementById('profileC');
  gsap.to(box, {scale:0.9, y:30, opacity:0, rotationX:10, duration:0.45, ease:"power3.in"});
  gsap.to(modal, {backdropFilter:"blur(0px)", duration:0.45, ease:"power3.in", onComplete:()=>{ modal.classList.remove('active'); }});
}
let cur=1,per=10;
function render(){
  document.getElementById('top3').innerHTML=PLAYERS.slice(0,3).map((p,i)=>`
    <div class="card ${p.rank===1?'king':''}" onclick="openProfile(${i})">
      <div class="mono">0${p.rank} — ELITE</div>
      <div class="card-skin">${skinEl(p.name,'md')}</div>
      <div class="card-name">${p.name}</div>
      <div class="mono" style="margin-top:4px">${p.elo.toLocaleString()} ELO • ${p.kdr} KDR</div>
    </div>`).join('');
  const start=(cur-1)*per;
  const slice=PLAYERS.slice(start,start+per);
  document.getElementById('tbody').innerHTML=slice.map((p,i)=>`
    <tr class="${p.rank===1?'king-row':''}" onclick="openProfile(${start+i})" style="cursor:pointer">
      <td class="mono">#${String(p.rank).padStart(2,'0')}</td>
      <td><div class="player">${skinEl(p.name,'sm')}<div style="font-weight:700">${p.name}</div></div></td>
      <td class="mono">${p.kdr}</td>
      <td class="mono">${p.elo.toLocaleString()}</td>
      <td><span class="tag live">ACTIVO</span></td>
    </tr>`).join('');
  let pages=Math.ceil(PLAYERS.length/per);
  let h=`<button onclick="go(${cur-1})">←</button>`;
  for(let i=1;i<=pages;i++){ if(i<=3 || i>pages-2 || Math.abs(i-cur)<=1){ h+=`<button class="${i===cur?'active':''}" onclick="go(${i})">${i}</button>` } }
  h+=`<button onclick="go(${cur+1})">→</button>`;
  document.getElementById('pagination').innerHTML=h;
  gsap.fromTo(".card", {y:30, opacity:0, scale:0.96}, {y:0, opacity:1, scale:1, duration:0.7, stagger:0.1, ease:"power4.out"});
  gsap.fromTo("#tbody tr", {x:-12, opacity:0}, {x:0, opacity:1, duration:0.4, stagger:0.02, ease:"power2.out", delay:0.15});
}
function go(p){if(p<1||p>Math.ceil(PLAYERS.length/per))return;cur=p;render(); document.getElementById('shell').scrollIntoView({behavior:'smooth'});}
document.addEventListener('mousemove', e=>{
  document.querySelectorAll('.card').forEach(card=>{
    const r=card.getBoundingClientRect();
    card.style.setProperty('--mx', ((e.clientX-r.left)/r.width)*100+'%');
    card.style.setProperty('--my', ((e.clientY-r.top)/r.height)*100+'%');
  });
});
window.addEventListener('load', ()=>{
  gsap.fromTo("#heroTitle div span", {y:"100%", opacity:0}, {y:"0%", opacity:1, duration:1, stagger:0.12, ease:"power4.out"});
});
document.getElementById('search').oninput=function(){
  let q=this.value.toLowerCase();
  if(!q){ render(); return; }
  let f=PLAYERS.filter(x=>x.name.toLowerCase().includes(q));
  document.getElementById('tbody').innerHTML=f.slice(0,per).map(p=>`<tr onclick="openProfile(${PLAYERS.indexOf(p)})" style="cursor:pointer"><td class="mono">#${String(p.rank).padStart(2,'0')}</td><td><div class="player">${skinEl(p.name,'sm')}<span style="font-weight:700">${p.name}</span></div></td><td class="mono">${p.kdr}</td><td class="mono">${p.elo.toLocaleString()}</td><td><span class="tag live">ACTIVO</span></td></tr>`).join('');
};
render();
</script>
</body>
</html>
